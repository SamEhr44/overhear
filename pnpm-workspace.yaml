packages:
  - apps/*
  - services/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@tailwindcss/oxide': true
  tesseract.js: true

minimumReleaseAgeExclude:
  - fastify@5.11.0

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - unrs-resolver
